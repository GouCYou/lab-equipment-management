server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18180}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lab_equipment_local?serverTimezone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
logging:
  level:
    org.springframework.security: ERROR
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
